[package]
name = "qingjian-linux"
description = "Linux 输入法壳（只做 Wayland）：把系统输入事件翻译成 Engine 的输入，把 Engine 返回的候选画出来"
# apps/* 各壳独立发布，版本写死在自己这里（见 docs/contributing.md）
version = "0.1.0-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "qingjian-linux"
path = "src/main.rs"

[dependencies]
dotenvy.workspace = true
qingjian-core.workspace = true
qingjian-dictionary.workspace = true
qingjian-learning.workspace = true
qingjian-lm.workspace = true
qingjian-neural.workspace = true
qingjian-platform.workspace = true
qingjian-predict.workspace = true
qingjian-translate.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zbus.workspace = true

[lints]
workspace = true

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false }
