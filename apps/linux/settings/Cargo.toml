# apps/* 各壳独立发布，版本写死在自己这里（见 docs/contributing.md）
version = "0.1.0-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "qingjian-settings"
path = "src/main.rs"

[dependencies]
gtk.workspace = true
qingjian-core.workspace = true
qingjian-platform.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
