# 青简的 Flatpak 清单。
#
# **这不是 Flathub 那种从源码构建的清单**：它装的是本机 `cargo build --release` 出来的二进制
# （`build-flatpak.sh` 先编译、再把产物摆进 staging/）。理由是 Flathub 要求构建过程离线，
# 那需要把整棵 cargo 依赖树导成 cargo-sources.json 再随包走；自建分发用不着，也不值得维护那份东西。
# 真要上 Flathub 时把 modules 换成 rust-stable SDK extension + cargo-sources.json 即可，
# 其余（权限、组件 XML、数据位置）都不用动。
#
# 用之前先读 README 的「Flatpak」一节：**输入法本体走 Flatpak 有一处绕不过去的手工步骤**，
# ibus-daemon 只认 /usr/share/ibus/component/，而 Flatpak 导出的东西到不了那里。
app-id: app.qingjian.Qingjian
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
# 直接 `flatpak run` 起的是设置界面；输入法引擎由 ibus-daemon 用 --command=qingjian-linux 拉起
command: qingjian-settings

finish-args:
  # 设置界面要画窗口
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # 云联想要发请求（关着的话这条用不上，但权限是安装时就定死的）
  - --share=network
  # IBus 的总线地址文件与 socket 都是**宿主机上** ibus-daemon 写的，沙箱里要能读到，否则引擎连不上总线。
  # 三处都给是因为各发行版摆放不同：地址文件在 ~/.config/ibus/bus，socket 见过 ~/.cache/ibus 与 /run/user/<uid>/ibus。
  - --filesystem=~/.config/ibus:ro
  - --filesystem=~/.cache/ibus:ro
  - --filesystem=xdg-run/ibus:ro

modules:
  - name: qingjian
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/qingjian-linux /app/bin/qingjian-linux
      - install -Dm755 bin/qingjian-settings /app/bin/qingjian-settings
      # 词库 / 语言模型 / 模型是可选的，没摆进 staging 就跳过（Core 缺了各退一档，不影响启动）
      - |
        if [ -d share/qingjian ]; then
          mkdir -p /app/share
          cp -r share/qingjian /app/share/
        fi
      - install -Dm644 share/applications/app.qingjian.Qingjian.desktop -t /app/share/applications/
      - install -Dm644 share/metainfo/app.qingjian.Qingjian.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 share/icons/hicolor/512x512/apps/app.qingjian.Qingjian.png -t /app/share/icons/hicolor/512x512/apps/
    sources:
      # 相对**本文件所在目录**；构建脚本会把这份清单拷到 target/flatpak/ 下，staging 就在它旁边
      - type: dir
        path: staging
