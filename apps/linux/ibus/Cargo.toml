[package]
name = "qingjian-linux-ibus"
description = "Linux IBus 前端：把 IBus 的按键与焦点事件转给 Server，把帧交给 IBus 面板画"
version = "0.1.0-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "qingjian-linux-ibus"
path = "src/main.rs"

# 不依赖 qingjian-core / -dictionary / -lm：前端不扛 Engine，词库、排序、学习全在 Server 那一侧。
# 线上类型走 qingjian-platform::protocol（与 Windows 的 TSF DLL 同一条理由，见那个模块的文档）。
[dependencies]
qingjian-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc = "0.2.189"

[lints]
workspace = true
